<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Projet DevOps</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            border-top: 5px solid #2ecc71;
        }
        h1 { color: #2c3e50; }
        p { color: #7f8c8d; font-size: 1.2rem; }
        .status {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 15px;
            background: #e8f8f0;
            color: #27ae60;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1></h1>
        <p>Ce projet HTML est déployé via <strong>GitHub Actions</strong>.</p>
    </div>

</body>
</html>
